[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stride"
version = "0.0.1"
description = "Hands-free voice timer for track and gym workouts, built to work out of breath, in wind and in crowds."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ojas Kothari" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
# Live audio + on-device STT. Kept optional so core logic and CI stay lightweight.
audio = ["faster-whisper>=1.0", "sounddevice>=0.4.7", "numpy>=1.26"]

[project.scripts]
stride = "stride.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stride"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
