# The phrases every speaker records for the noise study. FROZEN once recording starts:
# changing a phrase's text or label after clips exist breaks the labels of those clips.
# Add new phrases with new ids instead, and bump `version`.
#
# group:
#   core      read aloud as written; may be used for training (M5)
#   heldout   read aloud as written; NEVER used for training. Measures whether stride understands
#             phrasings nobody designed for. Chosen before any results exist.
#   own_words the speaker sees a situation, not a sentence, and says it however they naturally
#             would. NEVER used for training. The speaker types what they said.
# post_rep: also recorded right after a hard rep (the short list for practice sessions).
# Labels: intent + slots exactly as stride.intent.Intent. Omitted slot = not stated.

version = 1

# --- start a rest ---------------------------------------------------------------------------
[[phrase]]
